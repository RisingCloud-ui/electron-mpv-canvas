<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>electron-mpv-canvas demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage { position: relative; width: 100%; height: 100%; }
    #video-canvas { width: 100%; height: 100%; display: block; }
    #controls {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 12px 16px; display: flex; gap: 10px; align-items: center;
      background: linear-gradient(transparent, rgba(0,0,0,0.6));
      font-family: -apple-system, sans-serif; color: #fff;
    }
    button { cursor: pointer; }
    /* 进度条就浮在 canvas 上——这正是本库的核心卖点:
       视频只是 <canvas> 里的像素,任何 DOM 都能自由叠加 */
    #progress { flex: 1; cursor: pointer; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="video-canvas"></canvas>
    <div id="controls">
      <button id="btn-play">▶</button>
      <button id="btn-pause">⏸</button>
      <button id="btn-open">打开视频</button>
      <input id="progress" type="range" min="0" max="0" step="0.1" value="0" />
      <span id="fps">0 fps</span>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
