<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>mpv-electron-addon demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage { position: relative; width: 100%; height: 100%; }
    #video-canvas { width: 100%; height: 100%; display: block; }
    #controls {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 12px 16px; display: flex; gap: 10px; align-items: center;
      background: linear-gradient(transparent, rgba(0,0,0,0.6));
      font-family: -apple-system, sans-serif; color: #fff;
    }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="video-canvas"></canvas>
    <div id="controls">
      <button id="btn-play">▶</button>
      <button id="btn-pause">⏸</button>
      <button id="btn-open">打开文件路径(prompt)</button>
      <span id="fps">0 fps</span>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
